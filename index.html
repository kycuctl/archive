<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>건양사이버대학교 콘텐츠 아카이브 | 사이버대학 디지털 교육환경 고도화 지원 사업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F7; --bg2:#E6E8EF; --card:#FFFFFF; --ink:#10131C; --muted:#5A6075; --line:rgba(16,19,28,.1); --hover:rgba(16,19,28,.05);
  --care:#0BA58A; --digital:#2F5BFF; --insight:#8A3FFF; --accent:#2F5BFF;
  color-scheme:light;
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E16; --bg2:#141824; --card:#171C2A; --ink:#F1F3F9; --muted:#9298AD; --line:rgba(255,255,255,.09); --hover:rgba(255,255,255,.06);
    --care:#2BDDBE; --digital:#6A8EFF; --insight:#B783FF; --accent:#6A8EFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E16; --bg2:#141824; --card:#171C2A; --ink:#F1F3F9; --muted:#9298AD; --line:rgba(255,255,255,.09); --hover:rgba(255,255,255,.06);
  --care:#2BDDBE; --digital:#6A8EFF; --insight:#B783FF; --accent:#6A8EFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#07090F}
button{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{padding:0 clamp(16px,4vw,56px)}

/* ── top bar ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(#07090F,rgba(7,9,15,.88));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#F1F3F9;border-bottom:1px solid rgba(255,255,255,.06)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-size:clamp(16px,2vw,20px);letter-spacing:.01em;white-space:nowrap}
.logo b{display:flex;align-items:center}
.logo b img{height:22px;width:auto}
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14.5px;color:#9EA5BC;white-space:nowrap}
.nav a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.1)}
.nav a:not([aria-current="page"]):hover{color:#fff}

/* ── hero carousel (always dark) ── */
.hero{background:#0B0E16;color:#F1F3F9;padding:clamp(28px,4vw,48px) 0 clamp(28px,4vw,44px);overflow:hidden;position:relative}
.intro{text-align:center;padding:0 20px;animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.prog{margin:0;font-weight:600;font-size:clamp(13px,1.5vw,16px);color:#AEB4C8}
h1{margin:10px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,62px);line-height:1.1;letter-spacing:-.02em}
h1 .ax{background:linear-gradient(95deg,#2BDDBE,#6A8EFF 50%,#B783FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.hy{background:linear-gradient(90deg,#2BDDBE,#6A8EFF,#B783FF,#FF7AB6,#FFB547,#2BDDBE) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hyflow 6s linear infinite}
@keyframes hyflow{to{background-position:300% 0}}
.intro h1 .l2{white-space:nowrap}
.hdesc{max-width:62em;margin:16px auto 0;font-size:clamp(13px,1.3vw,15px);line-height:1.75;color:#9EA5BC}
@media (max-width:700px){.intro h1 .l2{font-size:.8em}.intro h1{font-size:clamp(26px,8.4vw,44px)}.hdesc{font-size:13px}}
.hcred{max-width:46em;margin:14px auto 0;padding-top:12px;border-top:1px solid rgba(160,170,200,.18);font-size:12.5px;line-height:1.7;color:#7E869E}
@media (max-width:700px){.hcred{font-size:12px}}
.hsig{margin:10px 0 0;font-size:13.5px;font-weight:700;letter-spacing:.02em;color:#C9D0E4}
.yrs{display:inline-flex;align-items:center;gap:14px;margin:16px 0 0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.18em;color:#9EA5BC}
.yrs::before,.yrs::after{content:"";width:28px;height:1px;background:#3A4055}
.car{position:relative;margin-top:clamp(22px,3vw,34px);--sw:min(56vw,820px);--gap:clamp(10px,1.6vw,22px)}
.track{display:flex;gap:var(--gap);transition:transform .7s cubic-bezier(.65,0,.25,1);will-change:transform;touch-action:pan-y}
.slide{position:relative;flex:none;width:var(--sw);border-radius:clamp(10px,1.2vw,16px);overflow:hidden;background:#121725;transform:scale(.9);opacity:.38;transition:transform .7s cubic-bezier(.65,0,.25,1),opacity .7s;cursor:pointer;align-self:center}
.slide.on{transform:none;opacity:1;box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07)}
.slide .art{display:block;position:relative;background:#0D1120}
.slide .art img{display:block;width:100%;height:auto}
.slide .art .ph{aspect-ratio:16/9;width:100%}
.slide .info{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(12px,1.6vw,18px) clamp(14px,2vw,24px);border-top:1px solid rgba(255,255,255,.06);opacity:0;transition:opacity .5s .2s}
.slide.on .info{opacity:1}
.info .tag{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--fc)}
.info .tag i{width:8px;height:8px;border-radius:2px;background:var(--fc)}
.info h2{margin:2px 0 0;font-size:clamp(17px,1.7vw,22px);font-weight:700;letter-spacing:-.02em;line-height:1.3}
.info p{margin:1px 0 0;color:#9EA5BC;font-size:13.5px}
.cta{display:flex;flex:none;gap:8px}
.b-play{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;background:#F1F3F9;color:#07090F;font-weight:700;font-size:clamp(14px,1.4vw,16px);padding:10px 22px 10px 18px;border-radius:8px}
.b-play svg{width:13px;height:13px;fill:currentColor}
.b-play:hover{background:#fff}
.b-more{display:inline-flex;align-items:center;border:0;cursor:pointer;background:rgba(160,170,200,.28);color:#fff;font-weight:600;font-size:clamp(14px,1.4vw,16px);padding:10px 18px;border-radius:8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.b-more:hover{background:rgba(160,170,200,.4)}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:clamp(38px,4vw,52px);height:clamp(38px,4vw,52px);border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(7,9,15,.6);color:#fff;cursor:pointer;display:grid;place-items:center;z-index:3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.nav-btn:hover{background:rgba(7,9,15,.85)}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.nav-btn.l{left:calc((100% - var(--sw))/2 - clamp(19px,2vw,26px))}
.nav-btn.r{right:calc((100% - var(--sw))/2 - clamp(19px,2vw,26px))}
.dots{display:flex;justify-content:center;gap:6px;margin-top:18px;position:relative;z-index:2}
.dots button{all:unset;cursor:pointer;width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);transition:width .3s,background .3s}
.dots button[aria-current="true"]{background:#fff;width:38px}
.dots button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ph{background:radial-gradient(circle at 70% 35%,color-mix(in srgb,var(--pc) 70%,transparent),transparent 62%),#0D1120}
@media (max-width:700px){.car{--sw:80vw}.nav-btn{display:none}.info .cta{display:none}.slide{transform:scale(.94)}}
/* ── notice ── */
.notice{display:flex;gap:12px;margin:8px 0 0;padding:12px 16px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:14px;line-height:1.6;color:var(--muted);max-width:980px}
.notice svg{flex:none;width:18px;height:18px;margin-top:2px;fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round}

/* ── rows ── */
main{padding-bottom:72px}
.field{margin-top:44px}
.field:first-child{margin-top:12px}
.field>h2{margin:0 0 2px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:400;font-size:clamp(22px,2.6vw,30px);color:var(--c)}
.field>h2::before{content:"";width:5px;height:.9em;border-radius:2px;background:var(--c)}
.row{margin-top:22px}
.row-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.row-head h3{margin:0;font-size:clamp(17px,1.8vw,20px);font-weight:700;letter-spacing:-.015em}
.tc{display:inline-flex;flex-wrap:wrap;gap:6px;margin-left:10px;vertical-align:2px}
.tc span{font-size:12.5px;font-weight:500;color:var(--muted);padding:2px 9px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.tc b{color:var(--c);font-weight:700}
.row-head h3 small .tk{color:var(--ink);font-weight:700}
.row-head h3 small{margin-left:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.row-head button{all:unset;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.row-head button:hover{color:var(--ink)}
.row-head button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.rail-wrap{position:relative;margin:0 calc(-1*clamp(16px,4vw,56px))}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px clamp(16px,4vw,56px) 10px;scroll-padding:0 clamp(16px,4vw,56px);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.ep{all:unset;box-sizing:border-box;display:block;cursor:pointer;flex:none;width:clamp(200px,22vw,290px);scroll-snap-align:start}
.ep .th{display:block;position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--bg2)}
.ep .th img,.ep .th .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ep .th .ph{display:flex;align-items:flex-end;padding:10px 12px;font-family:var(--display);font-size:20px;color:#fff}
.ep .num{position:absolute;left:8px;top:8px;padding:1px 8px;border-radius:5px;background:rgba(7,9,15,.78);color:#fff;font-size:12.5px;font-weight:600}
.ep .th::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 2px var(--c);opacity:0;transition:opacity .15s}
.ep .pl{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(241,243,249,.95);display:grid;place-items:center;opacity:0;transform:scale(.85);transition:opacity .15s,transform .15s}
.ep .pl svg{width:11px;height:11px;fill:#07090F;margin-left:2px}
.ep:hover .th::after,.ep:focus-visible .th::after{opacity:1}
.ep:hover .pl,.ep:focus-visible .pl{opacity:1;transform:none}
.ep b{display:block;margin-top:8px;font-size:14.5px;font-weight:600;line-height:1.4}
.ep span.m{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.arrow{position:absolute;top:4px;bottom:10px;width:clamp(16px,4vw,56px);border:0;cursor:pointer;background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--ink);display:none;align-items:center;justify-content:center;z-index:2}
.arrow svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2}
.arrow.l{left:0}.arrow.r{right:0}
@media (hover:hover) and (min-width:700px){.rail-wrap:hover .arrow{display:flex}}

/* ── player ── */
.view{padding-top:26px}
.back{border:0;background:none;padding:6px 0;cursor:pointer;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.back:hover{color:var(--ink)}
.vhead{margin:10px 0 20px}
.vhead .cat{font-size:14px;font-weight:600;color:var(--c);display:flex;align-items:center;gap:8px}
.vhead .cat i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.vhead h2{margin:4px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,46px);line-height:1.15}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.screen{background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;position:relative}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.screen.tall{aspect-ratio:auto;height:min(78vh,720px);background:#fff}
@media (max-width:700px){.screen.drive{aspect-ratio:auto;height:0;padding-top:56.25%}.screen.drive iframe{top:-56px;bottom:auto;height:calc(100% + 56px)}.screen.tall{height:80vh}}
.mtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:thin}
.mtabs[hidden]{display:none}
.mtabs button,.mtabs a{flex:none;display:inline-flex;align-items:center;gap:8px;max-width:340px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtabs em{font-style:normal;font-size:12px;font-weight:700;color:var(--c);flex:none}
.mtabs svg{flex:none;width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.mtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mtabs button[aria-selected="true"] em{color:inherit;opacity:.8}
.mtabs a:hover,.mtabs button:hover{border-color:var(--c)}
.xb{position:absolute;left:8px;bottom:8px;padding:1px 8px;border-radius:5px;background:var(--c);color:#07090F;font-size:12px;font-weight:700}
.xs{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--c)}
.now{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.now h3{margin:0;font-size:20px;letter-spacing:-.015em}
.now p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--c,var(--accent))}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.hint{margin:12px 0 0;color:var(--muted);font-size:13.5px}
.eps{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.eps header{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.eps header span{color:var(--muted);font-weight:500}
.eps ol{list-style:none;margin:0;padding:6px;max-height:min(66vh,620px);overflow-y:auto}
.yoy{margin-top:28px;max-width:1200px;padding:22px clamp(16px,2.4vw,26px) 18px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.yoy-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px}
.yoy-head h2{margin:0;font-size:20px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lg i{width:12px;height:12px;border-radius:3px;margin-left:8px}
.b2025{background:color-mix(in srgb,var(--muted) 60%,transparent)}
.b2026{background:linear-gradient(90deg,var(--care),var(--digital) 55%,var(--insight))}
.vchart{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;gap:clamp(8px,2vw,28px);padding:8px 4px 0;border-bottom:1px solid var(--muted);position:relative;background:repeating-linear-gradient(0deg,transparent 0 calc(25% - 1px),var(--line) calc(25% - 1px) 25%);height:clamp(220px,32vw,320px);margin-top:28px}
.vc{display:grid;grid-template-rows:1fr;height:100%;position:relative}
.vbars{display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,.8vw,10px);height:100%}
.vb{flex:1;max-width:46px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.vb i{display:block;width:100%;height:var(--h);min-height:3px;border-radius:5px 5px 0 0;transform-origin:bottom;animation:growY 1s cubic-bezier(.2,.7,.2,1) var(--d) both}
.vb .stk{display:flex;flex-direction:column;width:100%;height:var(--h);min-height:3px;border-radius:5px 5px 0 0;overflow:hidden;transform-origin:bottom;animation:growY 1s cubic-bezier(.2,.7,.2,1) var(--d) both}
.vb .stk i{height:auto;min-height:0;border-radius:0;animation:none}
.bplan{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--insight) 55%,transparent) 0 5px,transparent 5px 9px);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--insight) 70%,transparent)}
.vb .stk .bplan{border-radius:5px 5px 0 0}
.vb b small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);text-align:center}
.vb i.b2026{background:linear-gradient(0deg,var(--care),var(--digital) 55%,var(--insight))}
.vb b{text-align:center}
.vb b{font-size:clamp(11px,1.2vw,14px);margin-bottom:5px;white-space:nowrap;animation:fadeIn .4s ease calc(var(--d) + .7s) both}
.vc.big .vb{max-width:58px}
.vc.big .vb i.b2025{background:color-mix(in srgb,#FFB547 38%,transparent)}
.vc.big .vb i.b2026{background:linear-gradient(0deg,#FF8A3D,#FFC857)}
.vc.big .vb .bplan{background:repeating-linear-gradient(135deg,rgba(255,181,71,.6) 0 5px,transparent 5px 9px);box-shadow:inset 0 0 0 1.5px rgba(255,181,71,.8)}
.vc.big .vb b{color:#FFB547}
:root:not([data-theme="dark"]) .vc.big .vb b{color:#C26A00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .vc.big .vb b{color:#FFB547}}
.vc.big .vb b{font-size:clamp(13px,1.4vw,17px)}
.vc.big::before{content:"";position:absolute;left:calc(-1*clamp(4px,1vw,14px));top:0;bottom:0;border-left:1px dashed var(--line)}
.vn,.vc em{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center}
.vn{top:calc(100% + 10px);font-weight:700;font-size:clamp(12px,1.2vw,14px)}
.vc em{top:calc(100% + 32px);font-style:normal;font-weight:700;font-size:13px}
.vchart{margin-bottom:64px}
em.up{color:var(--care)}em.down,em.flat{color:var(--muted)}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (max-width:560px){.vb b small{display:none}.vn{font-size:11px;white-space:normal;width:100%;word-break:keep-all;line-height:1.25}.vc em{top:calc(100% + 42px);font-size:12px}.vchart{margin-bottom:76px}}
@media (prefers-reduced-motion:reduce){.vb i,.vb b{animation:none}}
.ynote{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
.guide{margin-top:28px;max-width:1200px}
.guide h2{font-size:20px;margin:0 0 12px}
.gd{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.gd article{padding:18px 18px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.gt{display:flex;align-items:center;gap:10px}
.gt .ab{flex:none;min-width:40px;text-align:center;padding:3px 7px;border-radius:6px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11.5px;font-weight:500;letter-spacing:.06em;color:#07090F;background:linear-gradient(95deg,var(--care),var(--digital) 55%,var(--insight))}
.gt b{font-size:16px}
.gt em{margin-left:auto;font-style:normal;font-size:13px;color:var(--muted)}
.gd p{margin:10px 0 0;font-size:14px;line-height:1.65;color:var(--muted)}
.devcard{display:flex;align-items:center;gap:12px;padding:20px 22px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:14.5px;background:repeating-linear-gradient(135deg,transparent 0 14px,var(--hover) 14px 15px)}
.devtag{flex:none;display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--c,var(--accent));color:var(--c,var(--accent));font-size:12.5px;font-weight:700}
.devrow td{color:var(--muted)}
.eps li.gh{display:flex;justify-content:space-between;padding:12px 10px 6px;font-size:13px;font-weight:700;color:var(--c);border-top:1px solid var(--line);margin-top:4px}
.eps li.gh:first-child{border-top:0;margin-top:0;padding-top:6px}
.eps li.gh span{color:var(--muted);font-weight:500}
.eps li button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;padding:8px;border-radius:8px}
.eps li button:hover{background:var(--hover)}
.eps li button:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.eps li button[aria-current="true"]{background:color-mix(in srgb,var(--c) 16%,transparent)}
.eps .mini{display:block;position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--bg2)}
.eps .mini img,.eps .mini .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.eps li button[aria-current="true"] .mini{box-shadow:0 0 0 2px var(--c)}
.eps b{display:block;font-size:14px;line-height:1.35}
.eps small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}

/* ── status ── */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none;align-items:center}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;font-size:14.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip .dot{width:8px;height:8px;border-radius:2px;background:var(--c,var(--ink))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .dot{background:var(--bg)}
.sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 6px}
.shead{padding-top:34px}
.shead h1{color:var(--ink);text-shadow:none;font-size:clamp(28px,4vw,44px);max-width:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:22px 0 0;max-width:1200px}
.stats div{background:var(--card);padding:16px 18px}
.stats b{display:block;font-family:var(--display);font-weight:400;font-size:26px}
.stats a{display:block;font-family:var(--display);font-size:26px;text-decoration:none;color:var(--ink)}
.stats a:hover{color:var(--accent)}
.det h2 small{margin-left:8px;font-size:14px;font-weight:500;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.det{scroll-margin-top:130px}
.stats span{color:var(--muted);font-size:14px}
.sum{margin-top:30px;max-width:1200px}
.sum h2,.det h2{font-size:20px;margin:0 0 12px}
.det{margin-top:40px;max-width:1200px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:860px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.wrapc{white-space:normal;min-width:220px}
th{font-weight:600;color:var(--muted);background:var(--bg2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.tg{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--c)}
.tg i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.yr{display:inline-block;padding:1px 8px;border-radius:6px;font-weight:600;font-size:13px;border:1px solid var(--line)}
.yr.y2025{color:var(--care)}.yr.y2026{color:var(--accent)}
td a.btn{padding:5px 10px;font-size:13px}
tfoot td{font-weight:600;background:var(--bg2);border-bottom:0}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:13.5px}

@media (max-width:980px){.stage{grid-template-columns:1fr}.eps ol{max-height:none}}
@media (max-width:560px){}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.intro{animation:none}.hy{animation:none}}
@media print{.top,.hero,.bar,footer,td:last-child,th:last-child{display:none}.tbl-wrap{overflow:visible;border:0}table{min-width:0;font-size:11px}th{position:static}}
</style>
</head>

    screen.className = "screen" + (!x && !l.yt ? " drive" : "") + (x && /h5p/.test(x.embed) ? " tall" : "");
    document.getElementById("open").href = x ? x.url : vOpen(l);
    hint.textContent = !x && !l.yt ? "영상이 보이지 않으면 ‘새 창에서 보기’로 Google 드라이브에서 바로 재생할 수 있습니다." : (x && x.type==="360VR" ? "영상을 마우스로 끌거나 휴대폰을 움직여 360° 방향을 바꿀 수 있습니다." : "");
    tabs.querySelectorAll("[data-k]").forEach(b=>b.setAttribute("aria-selected", +b.dataset.k===k));
  }
  function set(i){
    idx=i; const l=L[i];
    tabs.innerHTML = l.extras ? `<button role="tab" data-k="-1">강의 영상</button>` + l.extras.map((x,k)=> x.embed
        ? `<button role="tab" data-k="${k}"><em>${esc(x.type)}</em>${esc(x.title)}</button>`
        : `<a href="${esc(x.url)}" target="_blank" rel="noopener"><em>${esc(x.type)}</em>${esc(x.title)}${linkIcon}</a>`).join("") : "";
    tabs.hidden = !l.extras;
    tabs.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>view(l,+b.dataset.k));
    view(l,-1);
    document.getElementById("nowT").textContent = l.grp ? l.title : (l.title ? `${l.label}. ${l.title}` : l.label);
    document.getElementById("nowM").textContent = l.grp ? `${l.grp} 과정 · ${l.meta}` : (l.meta || course.name);
    document.getElementById("prev").disabled = i===0;
    document.getElementById("next").disabled = i===L.length-1;
    app.querySelectorAll("#ol button").forEach(b=>b.setAttribute("aria-current", +b.dataset.i===i));
    const cur=app.querySelector(`#ol button[data-i="${i}"]`); const ol=document.getElementById("ol");
    if(cur&&ol.scrollHeight>ol.clientHeight) ol.scrollTop=Math.max(0,cur.parentElement.offsetTop-ol.offsetTop-ol.clientHeight/3);
  }
  app.querySelectorAll("#ol button").forEach(b=>b.onclick=()=>set(+b.dataset.i));
  document.getElementById("prev").onclick=()=>idx>0&&set(idx-1);
  document.getElementById("next").onclick=()=>idx<L.length-1&&set(idx+1);
  set(Math.min(idx||0,L.length-1));
}
