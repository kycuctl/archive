<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>건양사이버대학교 사이버대학 디지털 교육환경 고도화 지원 사업 콘텐츠 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#EAF0F7; --ink:#0C1B33; --muted:#5B6B82; --line:#DCE3EC;
  --accent:#1F4FFF; --care:#0B9483; --digital:#1F4FFF; --insight:#6D4AE6; --grid:rgba(31,79,255,.16);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220; --surface:#111C2E; --surface-2:#16243A; --ink:#E7EEF8; --muted:#8EA0B8; --line:#22324A;
    --accent:#7B94FF; --care:#2BC4AF; --digital:#7B94FF; --insight:#A58BFF; --grid:rgba(123,148,255,.18);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111C2E; --surface-2:#16243A; --ink:#E7EEF8; --muted:#8EA0B8; --line:#22324A;
  --accent:#7B94FF; --care:#2BC4AF; --digital:#7B94FF; --insight:#A58BFF; --grid:rgba(123,148,255,.18);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(var(--grid) 1.2px,transparent 1.4px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 75%);mask-image:linear-gradient(100deg,transparent 30%,#000 75%)}
.hero::after{content:"";position:absolute;top:0;bottom:0;width:2px;left:-2%;background:var(--accent);opacity:0;
  box-shadow:0 0 24px 6px var(--grid);animation:scan 2.4s cubic-bezier(.6,0,.3,1) .3s 1 forwards}
@keyframes scan{0%{left:-2%;opacity:.9}90%{opacity:.9}100%{left:102%;opacity:0}}
.hero .wrap{position:relative;padding-top:clamp(48px,9vw,104px);padding-bottom:clamp(40px,7vw,80px)}
.org{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--muted);font-size:15px;margin:0 0 20px}
.org i{display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px}
h1{margin:0;font-weight:700;letter-spacing:-.035em;line-height:1.12;font-size:clamp(30px,5.4vw,60px);max-width:15em}
h1 span{display:block;color:var(--muted);font-weight:500}
.lede{margin:24px 0 0;color:var(--muted);max-width:36em}

/* filter */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink))}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .dot{background:var(--bg)}

/* catalog */
main{padding-bottom:80px}
.group{padding-top:48px}
.group-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;padding-left:16px;border-left:4px solid var(--c)}
.group-head h2{margin:0;font-size:clamp(22px,2.6vw,28px);letter-spacing:-.02em;font-weight:700}
.group-head p{margin:0;color:var(--muted);font-size:15px}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.course{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:22px 22px 20px;cursor:pointer;display:flex;flex-direction:column;gap:18px;min-height:150px;overflow:hidden;transition:border-color .2s}
.course::before{content:"";position:absolute;right:-28px;top:-28px;width:110px;height:110px;
  background-image:radial-gradient(var(--c) 1.4px,transparent 1.6px);background-size:11px 11px;opacity:.28;border-radius:50%}
.course:hover{border-color:var(--c)}
.course h3{margin:0;font-size:19px;line-height:1.4;font-weight:600;letter-spacing:-.015em;max-width:15em;position:relative}
.course .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:14px}
.course .play{width:36px;height:36px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.course .play svg{width:12px;height:12px;fill:#fff;margin-left:2px}

/* player view */
.view{padding-top:28px}
.back{border:0;background:none;padding:6px 0;cursor:pointer;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.back:hover{color:var(--ink)}
.vhead{margin:14px 0 24px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.vhead .cat{font-size:14px;font-weight:600;color:var(--c);display:flex;align-items:center;gap:8px}
.vhead .cat i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.vhead h2{margin:6px 0 0;font-size:clamp(24px,3.4vw,36px);letter-spacing:-.03em;line-height:1.25}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.screen{background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;position:relative;border:1px solid var(--line)}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.now{margin-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.now h3{margin:0;font-size:20px;letter-spacing:-.015em}
.now p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--c)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list header{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;display:flex;justify-content:space-between}
.list header span{color:var(--muted);font-weight:500}
.list ol{list-style:none;margin:0;padding:6px;max-height:min(62vh,560px);overflow-y:auto}
.list li button{width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.list li button:hover{background:var(--surface-2)}
.list li button[aria-current="true"]{background:color-mix(in srgb,var(--c) 14%,transparent)}
.list .n{min-width:52px;font-size:13px;font-weight:600;color:var(--c);padding-top:2px}
.list .t{font-size:14.5px;line-height:1.45}
.list .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.hint{margin:14px 0 0;color:var(--muted);font-size:13.5px}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:13.5px}

/* tabs */
.tabs{display:inline-flex;gap:4px;margin-top:32px;padding:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.tabs a{text-decoration:none;padding:9px 18px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs a:not([aria-current="page"]):hover{color:var(--ink)}
/* status */
.bar .wrap.f{align-items:center}
.sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:32px 0 0}
.stats div{background:var(--surface);padding:16px 18px}
.stats b{display:block;font-size:24px;letter-spacing:-.02em}
.stats span{color:var(--muted);font-size:14px}
.sum{margin-top:28px}
.sum h2,.det h2{font-size:20px;margin:0 0 12px;letter-spacing:-.015em}
.det{margin-top:40px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:980px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.wrapc{white-space:normal;min-width:220px}
th{font-weight:600;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--c)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.yr{display:inline-block;padding:1px 8px;border-radius:6px;font-weight:600;font-size:13px;background:var(--surface-2)}
.yr.y2025{color:var(--care)}.yr.y2026{color:var(--accent)}
td a.btn{padding:5px 10px;font-size:13px}
tfoot td{font-weight:600;background:var(--surface-2);border-bottom:0}
@media print{.bar,.tabs,footer,.hero::before,.hero::after,td:last-child,th:last-child{display:none}.tbl-wrap{overflow:visible;border:0}table{min-width:0;font-size:11px}th{position:static}}
@media (max-width:900px){.stage{grid-template-columns:1fr}.list ol{max-height:none}}
@media (prefers-reduced-motion:reduce){.hero::after{animation:none;display:none}*{transition:none!important}}
</style>
</head>

"15tKTfbAAJK3D9fyU7IlUbAYzzbRTyv8P", "size": 10735335416}, {"label": "12주차 2강", "title": "", "meta": "", "id": "1zJsXwmfWKhv4sW0zFPR6odiw3x6gshc1", "size": 1682838816}], "year": 2026, "kind": "정규"}, {"cat": "insight", "slug": "end-of-life", "name": "삶의 끝에서 삶을 배우다", "lectures": [{"label": "1차시", "title": "", "meta": "", "id": "1_bib8br_XYonkvcAmgYc2pf5nNrDrVtW", "size": 990978838}, {"label": "2차시", "title": "", "meta": "", "id": "1Nk9U4KYV75MSit8YK3twfmjnX-J_djVX", "size": 858928104}, {"label": "3차시", "title": "", "meta": "", "id": "1t7At2GQ3SDSyopGweRlFb6ctFJz3Mrsr", "size": 1278319275}, {"label": "4차시", "title": "", "meta": "", "id": "17hM3vhkDPv-qyjlhXn-U-tPFCtV094Xb", "size": 1115819671}], "year": 2026, "kind": "비교과"}];
const CATS = {
  care:{name:"휴먼케어", v:"--care"},
  digital:{name:"디지털휴먼", v:"--digital"},
  insight:{name:"휴먼인사이트", v:"--insight"}
};
const app = document.getElementById("app");
const total = DATA.reduce((s,c)=>s+c.lectures.length,0);
document.getElementById("lede").textContent =
  `3개 분야 ${DATA.length}개 교과목, 강의 영상 ${total}편을 교과목별로 시청할 수 있습니다.`;
let filter = "all";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const playIcon = '<svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg>';

function catalog(){
  const chips = [["all","전체",null], ...Object.entries(CATS).map(([k,c])=>[k,c.name,c.v])]
    .map(([k,n,v])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}" ${v?`style="--c:var(${v})"`:""}>${v?'<span class="dot"></span>':""}${n}</button>`).join("");
  const groups = Object.entries(CATS).filter(([k])=>filter==="all"||filter===k).map(([k,c])=>{
    const list = DATA.filter(d=>d.cat===k);
    const n = list.reduce((s,d)=>s+d.lectures.length,0);
    return `<section class="group" style="--c:var(${c.v})">
      <div class="group-head"><h2>${c.name}</h2><p>교과목 ${list.length}개 · 강의 ${n}편</p></div>
      <div class="courses">${list.map(d=>`
        <button class="course" data-go="${d.slug}">
          <h3>${esc(d.name)}</h3>
          <div class="foot"><span>${d.year}년 개발 · 강의 ${d.lectures.length}편</span><span class="play">${playIcon}</span></div>
        </button>`).join("")}</div></section>`;
  }).join("");
  app.innerHTML = `<nav class="bar" aria-label="분야 선택"><div class="wrap">${chips}</div></nav><main><div class="wrap">${groups}</div></main>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;catalog();});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.go;});
}

function player(course, idx){
  const c = CATS[course.cat];
  const L = course.lectures;
  app.innerHTML = `<main class="view" style="--c:var(${c.v})"><div class="wrap">
    <button class="back" id="back"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg>전체 교과목</button>
    <div class="vhead"><div><div class="cat"><i></i>${c.name} · ${course.year}년 개발</div><h2>${esc(course.name)}</h2></div></div>
    <div class="stage">
      <div>
        <div class="screen"><iframe id="frame" title="강의 영상" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
        <div class="now">
          <div><h3 id="nowT"></h3><p id="nowM"></p></div>
          <div class="ctrls">
            <button class="btn" id="prev"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg>이전 강의</button>
            <button class="btn" id="next">다음 강의<svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
            <a class="btn" id="open" target="_blank" rel="noopener">새 창에서 보기</a>
          </div>
        </div>
        <p class="hint">영상이 보이지 않으면 '새 창에서 보기'로 Google 드라이브에서 바로 재생할 수 있습니다.</p>
      </div>
      <aside class="list"><header>강의 목록<span>${L.length}편</span></header><ol id="ol">${L.map((l,i)=>`
        <li><button data-i="${i}"><span class="n">${esc(l.label)}</span><span class="t">${esc(l.title||l.label)}${l.meta?`<small>${esc(l.meta)}</small>`:""}</span></button></li>`).join("")}</ol></aside>
    </div></div></main>`;
  document.getElementById("back").onclick=()=>{history.pushState("",document.title,location.pathname+location.search);route();};
  const frame=document.getElementById("frame");
  function set(i){
    idx=i; const l=L[i];
    frame.src=`https://drive.google.com/file/d/${l.id}/preview`;
    document.getElementById("open").href=`https://drive.google.com/file/d/${l.id}/view`;
    document.getElementById("nowT").textContent = l.title ? `${l.label}. ${l.title}` : l.label;
    document.getElementById("nowM").textContent = l.meta || course.name;
    document.getElementById("prev").disabled = i===0;
    document.getElementById("next").disabled = i===L.length-1;
    app.querySelectorAll("#ol button").forEach(b=>b.setAttribute("aria-current", +b.dataset.i===i));
    const cur=app.querySelector(`#ol button[data-i="${i}"]`);
    const ol=document.getElementById("ol"); if(cur&&ol.scrollHeight>ol.clientHeight) ol.scrollTop=cur.parentElement.offsetTop-ol.clientHeight/3;
  }
  app.querySelectorAll("#ol button").forEach(b=>b.onclick=()=>set(+b.dataset.i));
  document.getElementById("prev").onclick=()=>idx>0&&set(idx-1);
  document.getElementById("next").onclick=()=>idx<L.length-1&&set(idx+1);
  set(idx||0);
}


const mb = b => b>=1e9 ? (b/1e9).toFixed(2)+" GB" : (b/1e6).toFixed(0)+" MB";
let sFilter="all", sYear="all";
function status(){
  const rows=[];
  DATA.forEach(c=>c.lectures.forEach(l=>rows.push({c,l})));
  const show=rows.filter(r=>(sFilter==="all"||r.c.cat===sFilter)&&(sYear==="all"||String(r.c.year)===sYear));
  const courses=DATA.filter(c=>(sFilter==="all"||c.cat===sFilter)&&(sYear==="all"||String(c.year)===sYear));
  const totSize=show.reduce((s,r)=>s+r.l.size,0);
  const chip=(attr,k,n,v,cur)=>`<button class="chip" data-${attr}="${k}" aria-pressed="${cur===k}" ${v?`style="--c:var(${v})"`:""}>${v?'<span class="dot"></span>':""}${n}</button>`;
  const chips=[chip("f","all","전체 분야",null,sFilter),...Object.entries(CATS).map(([k,c])=>chip("f",k,c.name,c.v,sFilter)),
    '<span class="sep"></span>',chip("y","all","전체 연도",null,sYear),chip("y","2025","2025년 개발",null,sYear),chip("y","2026","2026년 개발",null,sYear)].join("");
  const tag=c=>`<span class="tag" style="--c:var(${CATS[c.cat].v})"><i></i>${CATS[c.cat].name}</span>`;
  const sumRows=courses.map((c,i)=>{const s=c.lectures.reduce((a,l)=>a+l.size,0);return `<tr>
    <td class="num">${i+1}</td><td>${tag(c)}</td><td class="wrapc">${esc(c.name)}</td><td>${c.kind||"-"}</td>
    <td><span class="yr y${c.year}">${c.year}년</span></td><td>동영상 강의</td><td class="num">${c.lectures.length}편</td><td class="num">${mb(s)}</td>
    <td><a class="btn" href="#${c.slug}">시청</a></td></tr>`}).join("");
  const detRows=show.map((r,i)=>{const {c,l}=r;const name=l.title?`${l.label}. ${l.title}`:`${c.name} ${l.label}`;return `<tr>
    <td class="num">${i+1}</td><td>${tag(c)}</td><td class="wrapc">${esc(c.name)}</td><td>${esc(l.label)}</td><td class="wrapc">${esc(name)}</td>
    <td>${l.meta?esc(l.meta):"-"}</td><td>동영상 강의</td><td>MP4</td><td class="num">${mb(l.size)}</td>
    <td><span class="yr y${c.year}">${c.year}년</span></td>
    <td><a class="btn" href="https://drive.google.com/file/d/${l.id}/view" target="_blank" rel="noopener">보기</a></td></tr>`}).join("");
  app.innerHTML=`<nav class="bar" aria-label="현황 필터"><div class="wrap f">${chips}</div></nav><main><div class="wrap">
    <div class="stats">
      <div><b>${courses.length}개</b><span>교과목</span></div>
      <div><b>${show.length}편</b><span>콘텐츠</span></div>
      <div><b>${mb(totSize)}</b><span>총 용량</span></div>
      <div><b>${[...new Set(courses.map(c=>c.year))].sort().join(", ")||"-"}</b><span>제작년도</span></div>
    </div>
    <section class="sum"><h2>교과목별 현황</h2><div class="tbl-wrap"><table>
      <thead><tr><th class="num">No</th><th>분야</th><th>교과목명</th><th>교육과정</th><th>제작년도</th><th>콘텐츠 유형</th><th class="num">콘텐츠 수</th><th class="num">용량</th><th></th></tr></thead>
      <tbody>${sumRows}</tbody>
      <tfoot><tr><td></td><td>합계</td><td>${courses.length}개 교과목</td><td></td><td></td><td></td><td class="num">${show.length}편</td><td class="num">${mb(totSize)}</td><td></td></tr></tfoot>
    </table></div></section>
    <section class="det"><h2>콘텐츠 상세 목록</h2><div class="tbl-wrap"><table>
      <thead><tr><th class="num">No</th><th>분야</th><th>교과목명</th><th>차시</th><th>콘텐츠명</th><th>수준 · 강사</th><th>콘텐츠 유형</th><th>파일 형식</th><th class="num">용량</th><th>제작년도</th><th></th></tr></thead>
      <tbody>${detRows}</tbody></table></div></section>
  </div></main>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{sFilter=b.dataset.f;status();});
  app.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{sYear=b.dataset.y;status();});
}
function setTabs(isStatus){
  document.getElementById("tWatch").setAttribute("aria-current", isStatus?"false":"page");
  document.getElementById("tStatus").setAttribute("aria-current", isStatus?"page":"false");
}
function route(){
  const slug=location.hash.slice(1);
  if(slug==="status"){setTabs(true);status();return;}
  setTabs(false);
  const course=DATA.find(d=>d.slug===slug);
  if(course){player(course,0);window.scrollTo(0,0);} else catalog();
}
window.addEventListener("hashchange",route);
document.getElementById("tWatch").onclick=e=>{e.preventDefault();history.pushState("",document.title,location.pathname+location.search);route();};
route();
</script>
</body>
</html>
